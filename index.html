<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Retro Arcade</title>
  <style>
    @font-face {
      font-family: 'Press Start 2P';
      src: url('/fonts/PressStart2P-Regular.ttf') format('truetype');
      font-display: swap;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      /* Matches the in-canvas LCD screen: same base khaki tone plus a faint
         dot-matrix grid, so the fixed border kept clear around the canvas
         reads as a continuation of the screen instead of a bare black frame. */
      background-color: #abb18c;
      background-image:
        repeating-linear-gradient(to right, rgba(22, 23, 15, 0.08) 0px, rgba(22, 23, 15, 0.08) 1px, transparent 1px, transparent 9px),
        repeating-linear-gradient(to bottom, rgba(22, 23, 15, 0.08) 0px, rgba(22, 23, 15, 0.08) 1px, transparent 1px, transparent 9px);
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game-root {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="game-root"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
