apply plugin: 'com.android.application'

// Release signing: reads android/keystore.properties if present (gitignored
// — see tools/store-assets or the launch punch-list for how to generate
// it). Falls back to an unsigned release build when absent, so a fresh
// checkout without the keystore still builds.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Unity LevelPlay credentials: android/levelplay.properties is gitignored
// (see android/levelplay.properties.example for the template). Any value
// left blank/missing falls back to "" below, which LevelPlayPlugin.java reads
// as "ads not configured" and safely no-ops -- same fallback shape as the
// keystore.properties handling above.
def levelPlayPropertiesFile = rootProject.file("levelplay.properties")
def levelPlayProperties = new Properties()
if (levelPlayPropertiesFile.exists()) {
    levelPlayProperties.load(new FileInputStream(levelPlayPropertiesFile))
}
def levelPlay = { String key -> levelPlayProperties.getProperty(key, "").trim() }
// Without an app key the LevelPlay SDK, its ad networks, the advertising-ID
// library and LevelPlayPlugin.java (src/ads/java) are left out of the build
// entirely, so an ad-free release ships no ad code and Play's Data safety
// scan matches "no data collected". AdsManager.ts already treats the missing
// plugin as "ads unavailable".
def adsEnabled = !levelPlay("appKey").isEmpty()

android {
    namespace "com.retroarcade.app"
    compileSdk rootProject.ext.compileSdkVersion
    // AGP 8+ no longer generates BuildConfig by default; LevelPlayPlugin.java
    // reads LevelPlay credentials from it (see buildConfigField calls below).
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.retroarcade.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 6
        versionName "1.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "LEVELPLAY_APP_KEY", "\"${levelPlay('appKey')}\""
        buildConfigField "String", "LEVELPLAY_BANNER_AD_UNIT_ID", "\"${levelPlay('bannerAdUnitId')}\""
        buildConfigField "String", "LEVELPLAY_INTERSTITIAL_AD_UNIT_ID", "\"${levelPlay('interstitialAdUnitId')}\""
        buildConfigField "String", "LEVELPLAY_REWARDED_CONTINUE_AD_UNIT_ID", "\"${levelPlay('rewardedContinueAdUnitId')}\""
        buildConfigField "String", "LEVELPLAY_REWARDED_HINTS_AD_UNIT_ID", "\"${levelPlay('rewardedHintsAdUnitId')}\""
        buildConfigField "String", "LEVELPLAY_REWARDED_UNDOS_AD_UNIT_ID", "\"${levelPlay('rewardedUndosAdUnitId')}\""
        buildConfigField "boolean", "LEVELPLAY_TEST_SUITE", "${levelPlay('testSuite') == 'true'}"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    sourceSets {
        main {
            if (adsEnabled) {
                java.srcDirs += 'src/ads/java'
            }
        }
    }
    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : null
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Unity LevelPlay (see android/app/src/ads/java/com/retroarcade/app/LevelPlayPlugin.java).
    // Adapter and network SDK versions are pinned in pairs from the adapter
    // changelogs (github.com/ironsource-mobile/levelplay-android-adapters);
    // bump them together.
    if (adsEnabled) {
        implementation "com.unity3d.ads-mediation:mediation-sdk:9.6.1"
        implementation "com.unity3d.ads-mediation:unityads-adapter:5.14.0"
        implementation "com.unity3d.ads:unity-ads:4.21.0"
        // Google Play services LevelPlay needs but doesn't bundle. The
        // ads-identifier manifest also adds the AD_ID permission.
        implementation "com.google.android.gms:play-services-appset:16.0.0"
        implementation "com.google.android.gms:play-services-ads-identifier:18.1.0"
        implementation "com.google.android.gms:play-services-basement:18.1.0"
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
