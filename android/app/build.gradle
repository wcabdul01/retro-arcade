apply plugin: 'com.android.application'

// Release signing: reads android/keystore.properties if present (gitignored
// — see tools/store-assets or the launch punch-list for how to generate
// it). Falls back to an unsigned release build when absent, so a fresh
// checkout without the keystore still builds.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// AppLovin MAX credentials: android/applovin.properties is gitignored (see
// android/applovin.properties.example for the template). Any value left
// blank/missing falls back to "" below, which AppLovinPlugin.java reads as
// "ads not configured" and safely no-ops -- same fallback shape as the
// keystore.properties handling above.
def appLovinPropertiesFile = rootProject.file("applovin.properties")
def appLovinProperties = new Properties()
if (appLovinPropertiesFile.exists()) {
    appLovinProperties.load(new FileInputStream(appLovinPropertiesFile))
}
def appLovinSdkKey = appLovinProperties.getProperty("sdkKey", "")

android {
    namespace "com.retroarcade.app"
    compileSdk rootProject.ext.compileSdkVersion
    // AGP 8+ no longer generates BuildConfig by default; AppLovinPlugin.java
    // reads AppLovin credentials from it (see buildConfigField calls below).
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.retroarcade.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [applovinSdkKey: appLovinSdkKey]
        buildConfigField "String", "APPLOVIN_SDK_KEY", "\"${appLovinSdkKey}\""
        buildConfigField "String", "APPLOVIN_BANNER_AD_UNIT_ID", "\"${appLovinProperties.getProperty('bannerAdUnitId', '')}\""
        buildConfigField "String", "APPLOVIN_INTERSTITIAL_AD_UNIT_ID", "\"${appLovinProperties.getProperty('interstitialAdUnitId', '')}\""
        buildConfigField "String", "APPLOVIN_REWARDED_AD_UNIT_ID", "\"${appLovinProperties.getProperty('rewardedAdUnitId', '')}\""
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : null
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // AppLovin MAX (see android/app/src/main/java/com/retroarcade/app/AppLovinPlugin.java).
    // Resolves from mavenCentral()/google() (both already declared in the
    // root build.gradle) -- no extra repository needed for the base SDK.
    implementation "com.applovin:applovin-sdk:+"
    // Advertising ID (AAID) module the AppLovin SDK needs but doesn't bundle.
    implementation "com.google.android.gms:play-services-ads-identifier:+"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
